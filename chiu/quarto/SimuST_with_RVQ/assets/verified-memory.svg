<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="310" viewBox="0 0 1160 310" role="img" aria-labelledby="title desc"><title id="title">Verified Memory 的防污染設計</title><desc id="desc">偏置後假設與獨立證據交由 Evidence Gate，控制可逆的記憶更新；虛線回饋路徑須受證據檢查，不能自我強化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#577083"/></marker></defs><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;font-size:23px;fill:#153447}.label{font-size:19px;fill:#577083}</style><rect x="10" y="35" width="225" height="90" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="122.5" y="74.5" text-anchor="middle">候選熱詞</text><text x="122.5" y="101.5" text-anchor="middle">可能正確／錯誤</text><rect x="300" y="35" width="240" height="90" rx="14" fill="#fff5df" stroke="#d7e0e4"/><text x="420.0" y="74.5" text-anchor="middle">偏置後 ASR 假設</text><text x="420.0" y="101.5" text-anchor="middle">不能單獨作確認證據</text><rect x="610" y="35" width="235" height="90" rx="14" fill="#c2e7ff" stroke="#d7e0e4"/><text x="727.5" y="74.5" text-anchor="middle">Evidence Gate</text><text x="727.5" y="101.5" text-anchor="middle">Accept／Defer／Suppress</text><rect x="910" y="35" width="240" height="90" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="1030.0" y="74.5" text-anchor="middle">可逆 Memory 更新</text><text x="1030.0" y="101.5" text-anchor="middle">保留來源與版本</text><rect x="300" y="195" width="240" height="70" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="420.0" y="224.5" text-anchor="middle">未加偏置的分數</text><text x="420.0" y="251.5" text-anchor="middle">或獨立可用證據</text><path d="M235 80 H300" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M540 80 H610" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M845 80 H910" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M540 230 H575 V105 H610" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1030 125 V285 H122 V125" fill="none" stroke="#577083" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="590" y="215" class="label">不直接以自己的輸出提高自己信心</text><text x="590" y="245" class="label">新證據可觸發降權、恢復或撤銷更新</text></svg>