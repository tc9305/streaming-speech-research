<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="310" viewBox="0 0 1160 310" role="img" aria-labelledby="title desc"><title id="title">已知時間點更新熱詞的串接式 SimulST 基線</title><desc id="desc">事件建立雙語 Term ID 與有效 context graph，中文語音經 decoder-side biasing 的 Streaming Transducer，再經增量 MT 與配對英文詞輸出字幕。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#577083"/></marker></defs><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;font-size:23px;fill:#153447}.label{font-size:19px;fill:#577083}</style><rect x="10" y="15" width="240" height="80" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="130.0" y="49.5" text-anchor="middle">更新事件</text><text x="130.0" y="76.5" text-anchor="middle">time／source／target</text><rect x="320" y="15" width="240" height="80" rx="14" fill="#fff5df" stroke="#d7e0e4"/><text x="440.0" y="49.5" text-anchor="middle">Term IDs／中文 tokens</text><text x="440.0" y="76.5" text-anchor="middle">有效 Context Graph</text><rect x="630" y="15" width="245" height="80" rx="14" fill="#c2e7ff" stroke="#d7e0e4"/><text x="752.5" y="49.5" text-anchor="middle">英文術語配對</text><text x="752.5" y="76.5" text-anchor="middle">以 Term ID 取回</text><rect x="10" y="175" width="240" height="90" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="130.0" y="228.0" text-anchor="middle">即時中文語音</text><rect x="320" y="175" width="240" height="90" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="440.0" y="214.5" text-anchor="middle">Streaming Transducer</text><text x="440.0" y="241.5" text-anchor="middle">解碼分數偏置</text><rect x="630" y="175" width="245" height="90" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="752.5" y="214.5" text-anchor="middle">增量中英 MT</text><text x="752.5" y="241.5" text-anchor="middle">術語控制接口待確認</text><rect x="945" y="175" width="205" height="90" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="1047.5" y="228.0" text-anchor="middle">英文字幕</text><path 