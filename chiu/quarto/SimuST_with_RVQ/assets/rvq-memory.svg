<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="310" viewBox="0 0 1160 310" role="img" aria-labelledby="title desc"><title id="title">RVQ 雙語術語庫的候選設計</title><desc id="desc">文字經 Term Encoder 形成向量，以固定共享 codebooks 殘差量化；因果 query 檢索回 Term IDs，再取回原始雙語詞對供 ASR 與 MT 使用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#577083"/></marker></defs><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;font-size:23px;fill:#153447}.label{font-size:19px;fill:#577083}</style><rect x="10" y="25" width="235" height="80" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="127.5" y="59.5" text-anchor="middle">術語文字</text><text x="127.5" y="86.5" text-anchor="middle">Term Encoder</text><rect x="310" y="25" width="235" height="80" rx="14" fill="#fff5df" stroke="#d7e0e4"/><text x="427.5" y="59.5" text-anchor="middle">RVQ：逐層編碼殘差</text><text x="427.5" y="86.5" text-anchor="middle">固定共享 Codebooks</text><rect x="610" y="25" width="235" height="80" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="727.5" y="59.5" text-anchor="middle">code IDs＋Term ID</text><text x="727.5" y="86.5" text-anchor="middle">保留原文與 metadata</text><rect x="910" y="25" width="240" height="80" rx="14" fill="#c2e7ff" stroke="#d7e0e4"/><text x="1030.0" y="59.5" text-anchor="middle">近似檢索</text><text x="1030.0" y="86.5" text-anchor="middle">候選 Term IDs</text><path d="M245 65 H310" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M545 65 H610" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M845 65 H910" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><rect x="310" y="190" width="235" height="75" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="427.5" y="222.0" text-anchor="middle">因果語音／文字 query</text><text x="427.5" y="249.0" text-anchor="middle">需與術語向量可比較</text><rect x="910" y="190" width="240" height="75" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="1030.0" y="222.0" text-anchor="middle">Top-K 詞對</text><text x="1030.0" y="249.0" text-anchor="middle">ASR／MT 術語控制</text><path d="M545 227 H575 V145 H880 V65 H910" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1030 105 V190" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><text x="10" y="155" class="label">壓縮對象：術語 embedding；不是音訊 codec</text><text x="10" y="300" class="label">在線新增／移除 Term Records 與索引；刪詞不刪共享 Codeword。檢索方法與品質均待驗證。</text></svg>