<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" role="img" aria-labelledby="title desc"><title id="title">排名 1：聲學確認雙語術語啟用</title><desc id="desc">僅以已取得語音與候選詞對計算聲學證據，經雙閾值 gate 控制目標詞是否進入翻譯 context。為研究方法構想。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#577083"/></marker></defs><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;font-size:23px;fill:#153447}.label{font-size:20px;fill:#577083}</style><rect x="10" y="35" width="230" height="85" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="125.0" y="71.5" text-anchor="middle">已接收語音</text><text x="125.0" y="99.5" text-anchor="middle">目前 chunk＋過去快取</text><rect x="300" y="35" width="230" height="85" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="415.0" y="71.5" text-anchor="middle">聲學術語偵測</text><text x="415.0" y="99.5" text-anchor="middle">來源詞 presence</text><rect x="590" y="35" width="225" height="85" rx="14" fill="#fff5df" stroke="#d7e0e4"/><text x="702.5" y="71.5" text-anchor="middle">啟用狀態 Gate</text><text x="702.5" y="99.5" text-anchor="middle">雙閾值＋狀態保留</text><rect x="880" y="35" width="270" height="85" rx="14" fill="#c2e7ff" stroke="#d7e0e4"/><text x="1015.0" y="71.5" text-anchor="middle">目標詞進入 context</text><text x="1015.0" y="99.5" text-anchor="middle">交給 SimulST 解碼</text><rect x="300" y="185" width="230" height="65" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="415.0" y="225.5" text-anchor="middle">候選雙語詞對</text><path d="M240 78 H300" fill="none" stroke="#577083" stroke-width="3" marker-end="url(#arrow)"/><path d="M530 78 H590" fill="none" stroke="#577083" stroke-width="3" marker-end="url(#arrow)"/><path d="M815 78 H880" fill="none" stroke="#577083" stroke-width="3" marker-end="url(#arrow)"/><path d="M415 185 V120" fill="none" stroke="#577083" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="185" class="label">OFF → ON：超過啟用閾值</text><text x="590" y="218" class="label">ON → OFF：低於停用閾值</text><text x="590" y="251" class="label">中間區域維持狀態，避免反覆切換</text></svg>