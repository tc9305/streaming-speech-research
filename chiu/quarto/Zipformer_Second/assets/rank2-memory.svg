<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" role="img" aria-labelledby="title desc"><title id="title">排名 2：時間衰減聲學熱詞記憶</title><desc id="desc">將詞對的聲學、檢索與時間資訊結合，排序並保留有限候選；時間老化與重新啟用皆為待驗證規則。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#577083"/></marker></defs><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;font-size:23px;fill:#153447}.label{font-size:20px;fill:#577083}</style><rect x="10" y="35" width="230" height="85" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="125.0" y="71.5" text-anchor="middle">當頁與歷史詞對</text><text x="125.0" y="99.5" text-anchor="middle">附時間戳／來源頁</text><rect x="300" y="35" width="230" height="85" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="415.0" y="71.5" text-anchor="middle">聲學＋檢索證據</text><text x="415.0" y="99.5" text-anchor="middle">加上 term age</text><rect x="590" y="35" width="225" height="85" rx="14" fill="#fff5df" stroke="#d7e0e4"/><text x="702.5" y="71.5" text-anchor="middle">時間衰減與 Top-k</text><text x="702.5" y="99.5" text-anchor="middle">容量／淘汰規則</text><rect x="880" y="35" width="270" height="85" rx="14" fill="#c2e7ff" stroke="#d7e0e4"/><text x="1015.0" y="71.5" text-anchor="middle">當前有效候選集</text><text x="1015.0" y="99.5" text-anchor="middle">供後續術語控制使用</text><path d="M240 78 H300" fill="none" stroke="#577083" stroke-width="3" marker-end="url(#arrow)"/><path d="M530 78 H590" fill="none" stroke="#577083" stroke-width="3" marker-end="url(#arrow)"/><path d="M815 78 H880" fill="none" stroke="#577083" stroke-width="3" marker-end="url(#arrow)"/><text x="10" y="200" class="label">當頁詞：即時候選</text><text x="300" y="200" class="label">近期詞：可保留</text><text x="590" y="200" class="label">久未支持的詞：降權</text><text x="880" y="200" class="label">重新出現的詞：恢復權重</text><text x="10" y="265" class="label">同一 Top-k 容量與檢索器下，比較無衰減 vs 有衰減；分數組合與參數尚待驗證。</text></svg>