<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" role="img" aria-labelledby="title desc"><title id="title">排名 4：術語感知提交策略</title><desc id="desc">草稿依一般提交信心與術語不確定性分流；穩定時定稿，不穩定時有限等待並重評。已定稿輸出不回改。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#577083"/></marker></defs><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;font-size:23px;fill:#153447}.label{font-size:20px;fill:#577083}</style><rect x="10" y="40" width="235" height="90" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="127.5" y="79.0" text-anchor="middle">翻譯暫存草稿</text><text x="127.5" y="107.0" text-anchor="middle">尚未 commit</text><rect x="310" y="40" width="240" height="90" rx="14" fill="#fff5df" stroke="#d7e0e4"/><text x="430.0" y="79.0" text-anchor="middle">一般提交信心</text><text x="430.0" y="107.0" text-anchor="middle">＋術語不確定性</text><rect x="620" y="5" width="235" height="85" rx="14" fill="#c2e7ff" stroke="#d7e0e4"/><text x="737.5" y="41.5" text-anchor="middle">證據足夠</text><text x="737.5" y="69.5" text-anchor="middle">COMMIT 定稿</text><rect x="620" y="155" width="235" height="85" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="737.5" y="191.5" text-anchor="middle">術語仍不穩定</text><text x="737.5" y="219.5" text-anchor="middle">HOLD 有限等待</text><rect x="910" y="155" width="240" height="85" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="1030.0" y="191.5" text-anchor="middle">更多語音／達等待上限</text><text x="1030.0" y="219.5" text-anchor="middle">重新評估或強制定稿</text><path d="M245 85 H310" fill="none" stroke="#577083" stroke-width="3" marker-end="url(#arrow)"/><path d="M550 85 H585 V48 H620" fill="none" stroke="#577083" stroke-width="3" marker-end="url(#arrow)"/><path d="M550 85 H585 V198 H620" fill="none" stroke="#577083" stroke-width="3" marker-end="url(#arrow)"/><path d="M855 198 H910" fill="none" stroke="#577083" stroke-width="3" marker-end="url(#arrow)"/><text x="10" y="275" class="label">只延後尚未定稿的術語區段；已 commit 的前綴保持不可修改。設定等待上限避免無限延遲。</text></svg>