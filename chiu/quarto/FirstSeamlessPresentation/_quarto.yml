project:
  type: default
  render:
    - seamless_streaming_progress.qmd
  post-render:
    - python3 assets/fix_preview.py
lang: zh-TW
format:
  revealjs:
    theme: simple
    css: styles.css
    width: 1280
    height: 720
    margin: 0.06
    center: false
    slide-number: c/t
    incremental: false
    transition: fade
    controls: true
    progress: true
    hash: true
    history: true
    navigation-mode: linear
    embed-resources: true
    html-math-method: plain
    preview-links: false
    footer: 'SeamlessStreaming · 實作進度與初步實驗 · 2026-10-08'
execute:
  echo: true
  warning: false
