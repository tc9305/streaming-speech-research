<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390" role="img" aria-labelledby="title desc"><title id="title">Duration 預測教學例子</title><desc id="desc">三個抽象字元 A B C 的 duration 為 2 1 3，展開為六個位置。數值為教學示意，並非模型實測。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#577083"/></marker></defs><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#153447;font-size:20px}.label{font-size:17px;fill:#577083}.head{font-weight:700;font-size:23px}.edge{fill:none;stroke:#577083;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="10" y="35" class="head">教學例子：每個字元分配不同數量的 unit 位置</text><rect x="20" y="65" width="130" height="60" rx="12" fill="#c2e7ff" stroke="#d7e0e4"/><text x="85.0" y="102.0" text-anchor="middle">A</text><rect x="200" y="65" width="130" height="60" rx="12" fill="#c2e7ff" stroke="#d7e0e4"/><text x="265.0" y="102.0" text-anchor="middle">B</text><rect x="380" y="65" width="130" height="60" rx="12" fill="#c2e7ff" stroke="#d7e0e4"/><text x="445.0" y="102.0" text-anchor="middle">C</text><text x="600" y="100" class="label">示意預測：d = [2, 1, 3]</text><path class="edge" d="M265 135 V190"/><rect x="20" y="205" width="145" height="65" rx="12" fill="#fff9b9" stroke="#d7e0e4"/><text x="92.5" y="244.5" text-anchor="middle">A</text><rect x="200" y="205" width="145" height="65" rx="12" fill="#fff9b9" stroke="#d7e0e4"/><text x="272.5" y="244.5" text-anchor="middle">A</text><rect x="380" y="205" width="145" height="65" rx="12" fill="#fff9b9" stroke="#d7e0e4"/><text x="452.5" y="244.5" text-anchor="middle">B</text><rect x="560" y="205" width="145" height="65" rx="12" fill="#fff9b9" stroke="#d7e0e4"/><text x="632.5" y="244.5" text-anchor="middle">C</text><rect x="740" y="205" width="145" height="65" rx="12" fill="#fff9b9" stroke="#d7e0e4"/><text x="812.5" y="244.5" text-anchor="middle">C</text><rect x="920" y="205" width="145" height="65" rx="12" fill="#fff9b9" stroke="#d7e0e4"/><text x="992.5" y="244.5" text-anchor="middle">C</text><text x="20" y="320" class="label">2 + 1 + 3 = 6 個 unit 位置；再由 NAR decoder 預測每個位置的 unit ID。</text></svg>