<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390" role="img" aria-labelledby="title desc"><title id="title">T2U 階層式上採樣與訓練監督</title><desc id="desc">Subword 表徵展開到 character，預測每個字元的 unit duration，再展開到 unit 長度並以 NAR decoder 生成。Teacher 與 aligner 位於訓練期。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#577083"/></marker></defs><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#153447;font-size:20px}.label{font-size:17px;fill:#577083}.head{font-weight:700;font-size:23px}.edge{fill:none;stroke:#577083;stroke-width:2.5;marker-end:url(#arrow)}</style><rect x="10" y="65" width="210" height="90" rx="12" fill="#e6f0f2" stroke="#d7e0e4"/><text x="115.0" y="105.0" text-anchor="middle">T2U encoder</text><text x="115.0" y="129.0" text-anchor="middle">subword length</text><rect x="240" y="65" width="210" height="90" rx="12" fill="#e6f0f2" stroke="#d7e0e4"/><text x="345.0" y="105.0" text-anchor="middle">Subword →</text><text x="345.0" y="129.0" text-anchor="middle">character</text><rect x="470" y="65" width="210" height="90" rx="12" fill="#fff9b9" stroke="#d7e0e4"/><text x="575.0" y="105.0" text-anchor="middle">Duration</text><text x="575.0" y="129.0" text-anchor="middle">predictor</text><rect x="700" y="65" width="210" height="90" rx="12" fill="#e6f0f2" stroke="#d7e0e4"/><text x="805.0" y="105.0" text-anchor="middle">Character →</text><text x="805.0" y="129.0" text-anchor="middle">unit</text><rect x="930" y="65" width="210" height="90" rx="12" fill="#e6f0f2" stroke="#d7e0e4"/><text x="1035.0" y="105.0" text-anchor="middle">NAR unit</text><text x="1035.0" y="129.0" text-anchor="middle">decoder</text><path class="edge" d="M220 110 H240"/><path class="edge" d="M450 110 H470"/><path class="edge" d="M680 110 H700"/><path class="edge" d="M910 110 H930"/><text x="15" y="35" class="head">推論路徑：文字表徵 → 時間展開 → 語音單元</text><rect x="240" y="245" width="210" height="70" rx="12" fill="#faf9f6" stroke="#d7e0e4"/><text x="345.0" y="287.0" text-anchor="middle">Teacher T2U</text><rect x="530" y="245" width="220" height="70" rx="12" fill="#faf9f6" stroke="#d7e0e4"/><text x="640.0" y="287.0" text-anchor="middle">Aligner</text><path class="edge" d="M450 280 H530"/><path d="M640 245 V205 H575 V155" stroke="#cf8734" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="770" y="272" class="label">虛線：訓練期 duration 監督</text><text x="770" y="301" class="label">推論時不需要 teacher / aligner</text></svg>