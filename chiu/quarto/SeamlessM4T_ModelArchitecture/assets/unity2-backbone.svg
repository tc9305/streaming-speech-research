<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390" role="img" aria-labelledby="title desc"><title id="title">SeamlessM4T v2 多模態架構</title><desc id="desc">語音經 Mel、Conformer 與 length adaptor，或文字經 NLLB text encoder，進入 text decoder；語音輸出再經 T2U 與 unit vocoder。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#577083"/></marker></defs><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#153447;font-size:20px}.label{font-size:17px;fill:#577083}.head{font-weight:700;font-size:23px}.edge{fill:none;stroke:#577083;stroke-width:2.5;marker-end:url(#arrow)}</style><rect x="5" y="50" width="160" height="70" rx="12" fill="#e6f0f2" stroke="#d7e0e4"/><text x="85.0" y="92.0" text-anchor="middle">Source speech</text><rect x="210" y="50" width="210" height="70" rx="12" fill="#e6f0f2" stroke="#d7e0e4"/><text x="315.0" y="80.0" text-anchor="middle">80-bin Mel</text><text x="315.0" y="104.0" text-anchor="middle">filterbanks</text><rect x="465" y="50" width="235" height="70" rx="12" fill="#c2e7ff" stroke="#d7e0e4"/><text x="582.5" y="80.0" text-anchor="middle">w2v-BERT 2.0</text><text x="582.5" y="104.0" text-anchor="middle">Conformer</text><rect x="750" y="50" width="175" height="70" rx="12" fill="#c2e7ff" stroke="#d7e0e4"/><text x="837.5" y="92.0" text-anchor="middle">Length adaptor</text><rect x="750" y="205" width="175" height="75" rx="12" fill="#c2e7ff" stroke="#d7e0e4"/><text x="837.5" y="237.5" text-anchor="middle">Text decoder</text><text x="837.5" y="261.5" text-anchor="middle">NLLB</text><rect x="465" y="205" width="235" height="75" rx="12" fill="#e6f0f2" stroke="#d7e0e4"/><text x="582.5" y="249.5" text-anchor="middle">NAR T2U</text><rect x="210" y="205" width="210" height="75" rx="12" fill="#e6f0f2" stroke="#d7e0e4"/><text x="315.0" y="237.5" text-anchor="middle">Unit vocoder</text><text x="315.0" y="26