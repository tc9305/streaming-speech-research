<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="360" viewBox="0 0 1160 360" role="img" aria-labelledby="title desc"><title id="title">動態雙語熱詞與串流翻譯研究構想</title><desc id="desc">投影片產生雙語熱詞並寫入 Memory，待驗證的檢索路徑將條件送往翻譯解碼端；即時語音經 Zipformer 編碼後產生目標文字。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#577083"/></marker></defs><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;font-size:23px;fill:#153447}.small{font-size:19px;fill:#577083}</style><rect x="10" y="20" width="195" height="75" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="107.5" y="65.5" text-anchor="middle">投影片文字／圖像</text><rect x="255" y="20" width="220" height="75" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="365.0" y="65.5" text-anchor="middle">雙語熱詞 Pair</text><rect x="525" y="20" width="215" height="75" rx="14" fill="#fff5df" stroke="#d7e0e4"/><text x="632.5" y="65.5" text-anchor="middle">動態 Memory Bank</text><path d="M205 57 H255" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M475 57 H525" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><rect x="10" y="200" width="195" height="90" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="107.5" y="253.0" text-anchor="middle">即時語音</text><rect x="255" y="200" width="220" height="90" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="365.0" y="239.0" text-anchor="middle">Zipformer</text><text x="365.0" y="267.0" text-anchor="middle">串流編碼</text><rect x="525" y="200" width="215" height="90" rx="14" fill="#c2e7ff" stroke="#d7e0e4"/><text x="632.5" y="239.0" text-anchor="middle">翻譯解碼端</text><text x="632.5" y="267.0" text-anchor="middle">設計待選定</text><rect x="810" y="200" width="330" height="90" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="975.0" y="239.0" text-anchor="middle">目標語言文字</text><text x="975.0" y="267.0" text-anchor="middle">檢查術語是否正確</text><path d="M205 245 H255" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M475 245 H525" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M740 245 H810" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M632 95 V200" fill="none" stroke="#cf8734" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="770" y="125" class="small">虛線：擬議 Memory 檢索／偏置路徑</text><text x="10" y="340" class="small">研究構想示意；Zipformer 串流 ASR recipe 仍需銜接或訓練翻譯端。</text></svg>