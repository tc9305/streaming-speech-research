<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="360" viewBox="0 0 1160 360" role="img" aria-labelledby="title desc"><title id="title">動態 Memory 與候選熱詞檢索</title><desc id="desc">目前與歷史投影片提供雙語詞對，Memory 儲存詞對與來源資訊，檢索候選後注入解碼端。容量管理與注入均為規劃。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#577083"/></marker></defs><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;font-size:23px;fill:#153447}.small{font-size:19px;fill:#577083}</style><rect x="10" y="70" width="195" height="100" rx="14" fill="#c2e7ff" stroke="#d7e0e4"/><text x="107.5" y="114.0" text-anchor="middle">目前投影片</text><text x="107.5" y="142.0" text-anchor="middle">當頁熱詞</text><rect x="10" y="210" width="195" height="85" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="107.5" y="246.5" text-anchor="middle">歷史投影片</text><text x="107.5" y="274.5" text-anchor="middle">已出現熱詞</text><rect x="275" y="120" width="240" height="115" rx="14" fill="#fff5df" stroke="#d7e0e4"/><text x="395.0" y="157.5" text-anchor="middle">Memory Bank</text><text x="395.0" y="185.5" text-anchor="middle">來源詞 ↔ 目標詞</text><text x="395.0" y="213.5" text-anchor="middle">頁碼／時間／信心度</text><rect x="585" y="120" width="220" height="115" rx="14" fill="#e6f0f2" stroke="#d7e0e4"/><text x="695.0" y="171.5" text-anchor="middle">Top-k 檢索</text><text x="695.0" y="199.5" text-anchor="middle">取回候選詞對</text><rect x="875" y="120" width="270" height="115" rx="14" fill="#c2e7ff" stroke="#d7e0e4"/><text x="1010.0" y="171.5" text-anchor="middle">解碼條件／偏置</text><text x="1010.0" y="199.5" text-anchor="middle">注入位置待比較</text><path d="M205 120 H240 V165 H275" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M205 252 H240 V190 H275" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M515 177 H585" fill="none" stroke="#577083" stroke-width="3"  marker-end="url(#arrow)"/><path d="M805 177 H875" fill="none" stroke="#cf8734" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="275" y="310" class="small">容量上限、去重與淘汰策略：實作時定義並記錄。</text><text x="585" y="70" class="small">以當前可用上下文形成 query</text></svg>