project:
  type: default
  render:
    - channel-asr-slides.qmd
  post-render:
    - python3 scripts/fix_slide_preview.py
lang: zh-TW
format:
  revealjs:
    theme: [default, theme.scss, channel-asr.scss]
    width: 1280
    height: 800
    margin: 0.05
    center: false
    slide-level: 2
    template-partials: [title-slide.html]
    slide-number: c/t
    transition: fade
    transition-speed: fast
    background-transition: fade
    controls: true
    progress: true
    hash: true
    history: true
    navigation-mode: linear
    preview-links: false
    embed-resources: true
    include-in-header: fonts.html
    html-math-method: mathml
    footer: "Huang et al. · arXiv:2508.08967v2 · Paper reading"
